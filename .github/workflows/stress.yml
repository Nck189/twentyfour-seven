name: Stress

# Flake hunt: runs only when the pushed commit message contains [stress].
# No retries, so a single dropped tap fails the run.
on:
  push:

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    if: contains(github.event.head_commit.message, '[stress]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start Supabase (local)
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime
      - name: Export local Supabase env
        run: |
          supabase status -o env \
            | sed -n -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
                     -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' \
                     -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' \
                     -e 's/^MAILPIT_URL=/MAILPIT_URL=/p' \
                     -e 's/^INBUCKET_URL=/MAILPIT_URL=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit chromium
      - name: CJ-15 under load (8 workers × 16 repeats, no retries)
        run: npx playwright test tests/e2e/today.spec.ts tests/e2e/regressions-m3.spec.ts -g "CJ-15" --workers=8 --repeat-each=16 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stress-report
          path: playwright-report
          retention-days: 7
