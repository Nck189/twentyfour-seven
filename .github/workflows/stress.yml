name: Stress

# Flake hunt: runs only when the pushed commit message contains [stress].
# No retries, so a single dropped tap fails the run.
on:
  push:

concurrency:
  # Only a newer [stress] push cancels a running stress run; other pushes get their own group.
  group: stress-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[stress]') && 'stress' || github.sha }}
  cancel-in-progress: true

jobs:
  stress:
    if: contains(github.event.head_commit.message, '[stress]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start Supabase (local)
        # Hosted runners sometimes report a Supabase port as already in use on the first try.
        # Log who holds the ports, clean up, and retry once.
        run: |
          EXCLUDE=studio,imgproxy,vector,logflare,edge-runtime
          if ! supabase start -x "$EXCLUDE"; then
            echo "::warning::supabase start failed; ports in use:"
            sudo ss -ltnp | grep -E ':5432[0-9]' || true
            docker ps -a
            supabase stop --no-backup || true
            sleep 5
            supabase start -x "$EXCLUDE"
          fi
      - name: Export local Supabase env
        run: |
          supabase status -o env \
            | sed -n -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
                     -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' \
                     -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' \
                     -e 's/^MAILPIT_URL=/MAILPIT_URL=/p' \
                     -e 's/^INBUCKET_URL=/MAILPIT_URL=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit chromium
      # Same parallelism as QC (2 workers). 8 workers on a hosted runner starved WebKit
      # (click "waiting for element to be stable" for 30 s, "WebKit encountered an internal
      # error"), which measured the runner, not the app. Many repeats, no retries instead.
      - name: CJ-15 repeated (2 workers × 24 repeats, no retries)
        run: npx playwright test tests/e2e/today.spec.ts tests/e2e/regressions-m3.spec.ts -g "CJ-15" --workers=2 --repeat-each=24 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stress-report
          path: playwright-report
          retention-days: 7
