name: QC

on:
  push:
  pull_request:

concurrency:
  group: qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start Supabase (local)
        # Hosted runners sometimes report a Supabase port as already in use on the first try.
        # Log who holds the ports, clean up, and retry once.
        run: |
          EXCLUDE=studio,imgproxy,vector,logflare,edge-runtime
          if ! supabase start -x "$EXCLUDE"; then
            echo "::warning::supabase start failed; ports in use:"
            sudo ss -ltnp | grep -E ':5432[0-9]' || true
            docker ps -a
            supabase stop --no-backup || true
            sleep 5
            supabase start -x "$EXCLUDE"
          fi
      - name: Export local Supabase env
        run: |
          supabase status -o env \
            | sed -n -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
                     -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' \
                     -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' \
                     -e 's/^MAILPIT_URL=/MAILPIT_URL=/p' \
                     -e 's/^INBUCKET_URL=/MAILPIT_URL=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
      - name: Static (G1)
        run: npm run qc:static
      - name: Unit + coverage (G2)
        run: npm run test:cov
      - name: Secrets (G5)
        run: npm run secrets:check
      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit chromium
      - name: E2E functional (G2/G4)
        run: npx playwright test tests/e2e
      # The artifact store isn't reachable from every debugging environment: print the page
      # snapshot (aria tree + error) of each failed attempt into the log as well.
      - name: Failure snapshots in the log
        if: always()
        run: |
          find test-results -name error-context.md 2>/dev/null | head -12 | while read -r f; do
            echo "::group::$f"; head -c 4000 "$f"; echo; echo "::endgroup::"
          done
      # Always kept (7 days): traces of tests that failed once and passed on retry show the cause.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
